openapi: 3.0.3
info:
  title: Workday Absence Management Accruals API
  description: Track employee attendance, absences, leave requests, and time off balances in the Workday platform. Supports entering time off, requesting leave of absence, managing accrual balances, and processing return-from-leave events.
  version: v1
  contact:
    name: Workday Developer Support
    url: https://developer.workday.com
  x-generated-from: documentation
  x-last-validated: '2026-05-03'
servers:
- url: https://{tenant}.workday.com/api/absence-management/v1
  description: Workday tenant-specific Absence Management REST API
  variables:
    tenant:
      default: your-tenant
      description: Your Workday tenant identifier
security:
- BearerAuth: []
tags:
- name: Accruals
  description: Operations for managing accrual overrides and balances
paths:
  /workers/{workerId}/accrualOverrides:
    get:
      operationId: listAccrualOverrides
      summary: List Accrual Overrides
      description: Retrieves accrual or time off adjustment/override information for a worker.
      tags:
      - Accruals
      parameters:
      - name: workerId
        in: path
        required: true
        description: The Workday ID of the worker
        schema:
          type: string
      responses:
        '200':
          description: Accrual overrides retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccrualOverridesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createAccrualOverride
      summary: Create Accrual Override
      description: Adds a new accrual or time off adjustment/override for a worker.
      tags:
      - Accruals
      parameters:
      - name: workerId
        in: path
        required: true
        description: The Workday ID of the worker
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccrualOverrideInput'
      responses:
        '201':
          description: Accrual override created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccrualOverride'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Bad request - invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AccrualOverridesResponse:
      type: object
      description: Response containing accrual overrides
      properties:
        total:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/AccrualOverride'
    AccrualOverrideInput:
      type: object
      description: Input for creating an accrual override
      properties:
        planId:
          type: string
          description: ID of the time off plan
        overrideType:
          type: string
          description: Type of override
          enum:
          - Adjustment
          - Override
        hours:
          type: number
          format: float
          description: Hours to adjust or override
        effectiveDate:
          type: string
          format: date
          description: Effective date of the override
        expirationDate:
          type: string
          format: date
          description: Optional expiration date
        reason:
          type: string
          description: Reason for the override
      required:
      - planId
      - overrideType
      - hours
      - effectiveDate
    ErrorResponse:
      type: object
      description: Standard error response
      properties:
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    AccrualOverride:
      type: object
      description: An accrual override record
      properties:
        id:
          type: string
          description: Unique ID of the accrual override
        workerId:
          type: string
          description: Workday ID of the worker
        planId:
          type: string
          description: ID of the time off plan
        overrideType:
          type: string
          description: Type of override
          enum:
          - Adjustment
          - Override
          - Expiration
        hours:
          type: number
          format: float
          description: Hours of the override
        effectiveDate:
          type: string
          format: date
          description: Date the override takes effect
        expirationDate:
          type: string
          format: date
          description: Date the override expires (if applicable)
        reason:
          type: string
          description: Reason for the override
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 Bearer token authentication
