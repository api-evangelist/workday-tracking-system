openapi: 3.2.0
info:
  title: Workday Absence Management Accruals Time Requests API
  description: Track employee attendance, absences, leave requests, and time off balances in the Workday platform. Supports entering time off, requesting leave of absence, managing accrual balances, and processing return-from-leave events.
  version: v1
  contact:
    name: Workday Developer Support
    url: https://developer.workday.com
  x-generated-from: documentation
  x-last-validated: '2026-05-03'
servers:
- url: https://{tenant}.workday.com/api/absence-management/v1
  description: Workday tenant-specific Absence Management REST API
  variables:
    tenant:
      default: your-tenant
      description: Your Workday tenant identifier
security:
- BearerAuth: []
tags:
- name: Time Requests
  description: Operations for creating and retrieving time requests
paths:
  /workers/{workerId}/timeRequests:
    get:
      operationId: listTimeRequests
      summary: List Time Requests
      description: Retrieves time requests for a worker.
      tags:
      - Time Requests
      parameters:
      - name: workerId
        in: path
        required: true
        description: The Workday ID of the worker
        schema:
          type: string
      - name: startDate
        in: query
        required: false
        description: Start date for time request retrieval (YYYY-MM-DD)
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        required: false
        description: End date for time request retrieval (YYYY-MM-DD)
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Time requests retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeRequestsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createTimeRequest
      summary: Create Time Request
      description: Creates a new user time request or updates an existing one.
      tags:
      - Time Requests
      parameters:
      - name: workerId
        in: path
        required: true
        description: The Workday ID of the worker
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeRequestInput'
      responses:
        '201':
          description: Time request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Bad request - invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    TimeRequestInput:
      type: object
      description: Input for creating a time request
      properties:
        requestDate:
          type: string
          format: date
          description: Date for the time request
          example: '2026-05-03'
        requestType:
          type: string
          description: Type of time request
          enum:
          - Overtime
          - AdjustmentRequest
          - ScheduleChange
        comment:
          type: string
          description: Comment explaining the request
      required:
      - requestDate
      - requestType
    ErrorResponse:
      type: object
      description: Standard error response
      properties:
        error:
          type: string
          description: Error code
          example: INVALID_REQUEST
        message:
          type: string
          description: Human-readable error message
          example: The request is missing required fields
        details:
          type: array
          description: Additional error details
          items:
            type: object
            properties:
              field:
                type: string
                description: Field that caused the error
              message:
                type: string
                description: Field-level error message
    TimeRequestsResponse:
      type: object
      description: Response containing time requests
      properties:
        total:
          type: integer
          description: Total count of time requests
        data:
          type: array
          description: Array of time requests
          items:
            $ref: '#/components/schemas/TimeRequest'
    TimeRequest:
      type: object
      description: A time request submitted by a worker
      properties:
        id:
          type: string
          description: Unique Workday ID of the time request
        workerId:
          type: string
          description: Workday ID of the worker
        requestDate:
          type: string
          format: date
          description: Date of the time request
        requestType:
          type: string
          description: Type of time request
          enum:
          - Overtime
          - AdjustmentRequest
          - ScheduleChange
        status:
          type: string
          description: Approval status of the request
          enum:
          - Draft
          - Submitted
          - Approved
          - Denied
        comment:
          type: string
          description: Worker's comment on the request
        approverComment:
          type: string
          description: Approver's comment
        createdAt:
          type: string
          format: date-time
          description: Timestamp of request creation
          readOnly: true
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 Bearer token authentication
