openapi: 3.2.0
info:
  title: Workday Absence Management Accruals Scheduling Organizations API
  description: Track employee attendance, absences, leave requests, and time off balances in the Workday platform. Supports entering time off, requesting leave of absence, managing accrual balances, and processing return-from-leave events.
  version: v1
  contact:
    name: Workday Developer Support
    url: https://developer.workday.com
  x-generated-from: documentation
  x-last-validated: '2026-05-03'
servers:
- url: https://{tenant}.workday.com/api/absence-management/v1
  description: Workday tenant-specific Absence Management REST API
  variables:
    tenant:
      default: your-tenant
      description: Your Workday tenant identifier
security:
- BearerAuth: []
tags:
- name: Scheduling Organizations
  description: Operations for managing scheduling organizations and settings
paths:
  /schedulingOrganizations:
    get:
      operationId: listSchedulingOrganizations
      summary: List Scheduling Organizations
      description: Returns scheduling organization data including high-level settings.
      tags:
      - Scheduling Organizations
      parameters:
      - name: limit
        in: query
        required: false
        description: Maximum number of records to return
        schema:
          type: integer
          default: 100
      - name: offset
        in: query
        required: false
        description: Offset for pagination
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Scheduling organizations retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingOrganizationsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createSchedulingOrganization
      summary: Create Scheduling Organization
      description: Creates a new scheduling organization.
      tags:
      - Scheduling Organizations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulingOrganizationInput'
      responses:
        '201':
          description: Scheduling organization created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingOrganization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /schedulingOrganizations/{orgId}:
    get:
      operationId: getSchedulingOrganization
      summary: Get Scheduling Organization
      description: Returns a specific scheduling organization.
      tags:
      - Scheduling Organizations
      parameters:
      - name: orgId
        in: path
        required: true
        description: The Workday ID of the scheduling organization
        schema:
          type: string
      responses:
        '200':
          description: Scheduling organization retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingOrganization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Bad request - invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    SchedulingOrganization:
      type: object
      description: A scheduling organization unit
      properties:
        id:
          type: string
          description: Unique Workday ID of the scheduling organization
        name:
          type: string
          description: Name of the scheduling organization
          example: North America Operations
        type:
          type: string
          description: Type of scheduling organization
          enum:
          - Site
          - Department
          - Team
        parentOrganizationId:
          type: string
          description: Parent organization ID (if hierarchical)
        timezone:
          type: string
          description: Timezone for the organization
          example: America/New_York
        operatingHours:
          type: object
          description: Operating hours configuration
          properties:
            openTime:
              type: string
              format: time
              description: Daily opening time
            closeTime:
              type: string
              format: time
              description: Daily closing time
            daysOfOperation:
              type: array
              description: Days when the location operates
              items:
                type: string
    SchedulingOrganizationInput:
      type: object
      description: Input for creating a scheduling organization
      properties:
        name:
          type: string
          description: Name of the organization
        type:
          type: string
          description: Organization type
          enum:
          - Site
          - Department
          - Team
        parentOrganizationId:
          type: string
          description: Parent organization ID (optional)
        timezone:
          type: string
          description: Timezone identifier
      required:
      - name
      - type
    SchedulingOrganizationsResponse:
      type: object
      properties:
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/SchedulingOrganization'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 Bearer token authentication
