openapi: 3.2.0
info:
  title: Workday Scheduling Worker Preferences API
  description: Create and manage employee work schedules, shifts, scheduling organizations, and labor demand within the Workday platform. Supports importing schedule data, managing shift assignments, and configuring scheduling settings.
  version: v1
  contact:
    name: Workday Developer Support
    url: https://developer.workday.com
  x-generated-from: documentation
  x-last-validated: '2026-05-03'
servers:
- url: https://{tenant}.workday.com/api/scheduling/v1
  description: Workday tenant-specific Scheduling REST API
  variables:
    tenant:
      default: your-tenant
      description: Your Workday tenant identifier
security:
- BearerAuth: []
tags:
- name: Worker Preferences
  description: Operations for managing worker scheduling preferences
paths:
  /workers/{workerId}/schedulingPreferences:
    get:
      operationId: getWorkerSchedulingPreferences
      summary: Get Worker Scheduling Preferences
      description: Returns scheduling preferences for a worker.
      tags:
      - Worker Preferences
      parameters:
      - name: workerId
        in: path
        required: true
        description: The Workday ID of the worker
        schema:
          type: string
      responses:
        '200':
          description: Worker preferences retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerSchedulingPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateWorkerSchedulingPreferences
      summary: Update Worker Scheduling Preferences
      description: Updates scheduling preferences for a worker.
      tags:
      - Worker Preferences
      parameters:
      - name: workerId
        in: path
        required: true
        description: The Workday ID of the worker
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerSchedulingPreferencesInput'
      responses:
        '200':
          description: Worker preferences updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerSchedulingPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    WorkerSchedulingPreferencesInput:
      type: object
      description: Input for updating scheduling preferences
      properties:
        preferredStartTime:
          type: string
          format: time
        preferredEndTime:
          type: string
          format: time
        preferredDaysOff:
          type: array
          items:
            type: string
        maxHoursPerWeek:
          type: number
          format: float
        minHoursPerWeek:
          type: number
          format: float
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    WorkerSchedulingPreferences:
      type: object
      description: A worker's scheduling preferences
      properties:
        workerId:
          type: string
          description: Workday ID of the worker
        preferredStartTime:
          type: string
          format: time
          description: Preferred shift start time
          example: 08:00:00
        preferredEndTime:
          type: string
          format: time
          description: Preferred shift end time
          example: '16:00:00'
        preferredDaysOff:
          type: array
          description: Preferred days off
          items:
            type: string
            enum:
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
            - Sunday
        maxHoursPerWeek:
          type: number
          format: float
          description: Maximum hours per week
          example: 40.0
        minHoursPerWeek:
          type: number
          format: float
          description: Minimum hours per week
          example: 32.0
        availability:
          type: object
          description: Worker availability by day of week
          additionalProperties:
            type: object
            properties:
              available:
                type: boolean
              startTime:
                type: string
                format: time
              endTime:
                type: string
                format: time
  responses:
    BadRequest:
      description: Bad request - invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 Bearer token authentication
